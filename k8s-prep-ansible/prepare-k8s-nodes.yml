---
- name: Prepare nodes for Kubernetes installation with KubeKey
  hosts: k8s_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"

    - name: Configure /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} K8S CLUSTER HOSTS"
        block: |
          {% for node in cluster_hosts %}
          {{ node.ip }} {{ node.name }}
          {% endfor %}

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Install common packages on Debian/Ubuntu
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install common packages on RHEL/Rocky/Alma/CentOS
      ansible.builtin.yum:
        name: "{{ common_packages }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - ip_vs
        - ip_vs_rr
        - ip_vs_wrr
        - ip_vs_sh
        - nf_conntrack

    - name: Persist Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter
          ip_vs
          ip_vs_rr
          ip_vs_wrr
          ip_vs_sh
          nf_conntrack

    - name: Configure Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
          net.ipv4.conf.all.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          vm.swappiness = 0
          fs.inotify.max_user_instances = 8192
          fs.inotify.max_user_watches = 524288

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Enable and start chrony
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Enable and start chrony on Debian/Ubuntu
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    - name: Stop firewalld if present
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Disable UFW if present
      ansible.builtin.command: ufw disable
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Disable SELinux immediately
      ansible.builtin.command: setenforce 0
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Disable SELinux permanently
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=.*'
        replace: 'SELINUX=disabled'
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Ensure root SSH login is available for KubeKey
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
        validate: 'sshd -t -f %s'

    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
      failed_when: false

    - name: Restart ssh on Debian/Ubuntu if sshd failed
      ansible.builtin.service:
        name: ssh
        state: restarted
      failed_when: false
      when: ansible_os_family == "Debian"


    - name: Create containerd registry mirror directory for Docker Hub
      ansible.builtin.file:
        path: /etc/containerd/certs.d/docker.io
        state: directory
        mode: "0755"

    - name: Configure containerd Docker Hub registry mirrors
      ansible.builtin.copy:
        dest: /etc/containerd/certs.d/docker.io/hosts.toml
        mode: "0644"
        content: |
          server = "https://registry-1.docker.io"

          [host."https://registry.arvancloud.ir"]
            capabilities = ["pull", "resolve"]

          [host."https://docker.arvancloud.ir"]
            capabilities = ["pull", "resolve"]

          [host."https://docker.shatel.ir"]
            capabilities = ["pull", "resolve"]

          [host."https://docker.iranserver.com"]
            capabilities = ["pull", "resolve"]

          [host."https://mirror-docker.runflare.com"]
            capabilities = ["pull", "resolve"]

    - name: Check if containerd service exists
      ansible.builtin.command: systemctl list-unit-files containerd.service
      register: containerd_service_check
      changed_when: false
      failed_when: false
    - name: Create containerd registry mirror directory for registry.k8s.io
      ansible.builtin.file:
        path: /etc/containerd/certs.d/registry.k8s.io
        state: directory
        mode: "0755"

    - name: Configure containerd Kubernetes registry mirror
      ansible.builtin.copy:
        dest: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
        mode: "0644"
        content: |
          server = "https://registry.k8s.io"
    
          [host."https://registry.cn-hangzhou.aliyuncs.com/google_containers"]
            capabilities = ["pull", "resolve"]
    
    - name: Restart containerd if installed
      ansible.builtin.service:
        name: containerd
        state: restarted
        enabled: true
      when: containerd_service_check.rc == 0
