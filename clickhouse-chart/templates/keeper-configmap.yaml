apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse-local.keeperFullname" . }}-config
  labels:
    {{- include "clickhouse-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: keeper
data:
  keeper_config.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>true</console>
      </logger>

      <listen_host>0.0.0.0</listen_host>

      <keeper_server>
        <tcp_port>{{ .Values.service.keeperPort }}</tcp_port>
        <server_id>__SERVER_ID__</server_id>

        <log_storage_path>/var/lib/clickhouse-keeper/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/coordination/snapshots</snapshot_storage_path>

        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>information</raft_logs_level>
        </coordination_settings>

        <raft_configuration>
          {{- range $i := until (.Values.keeper.replicas | int) }}
          <server>
            <id>{{ add1 $i }}</id>
            <hostname>{{ include "clickhouse-local.keeperFullname" $ }}-{{ $i }}.{{ include "clickhouse-local.keeperFullname" $ }}-headless.{{ $.Release.Namespace }}.svc.cluster.local</hostname>
            <port>{{ $.Values.service.keeperRaftPort }}</port>
          </server>
          {{- end }}
        </raft_configuration>
      </keeper_server>
    </clickhouse>
